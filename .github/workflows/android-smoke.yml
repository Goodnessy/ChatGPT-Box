name: Android 16 Startup Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/context-health-v0.2
    paths:
      - "androidApp/**"
      - "shared/**"
      - ".github/workflows/android-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 16 emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            adb logcat -c
            adb shell am start -W -n com.kuyermqi.quotawidget.debug/com.kuyermqi.quotawidget.MainActivity || true
            sleep 8
            echo "===== PROCESS CHECK ====="
            adb shell pidof com.kuyermqi.quotawidget.debug || true
            echo "===== CRASH LOG ====="
            adb logcat -d -v threadtime | grep -A 80 -B 20 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.kuyermqi.quotawidget.debug" || true
            if ! adb shell pidof com.kuyermqi.quotawidget.debug >/dev/null; then
              echo "App process is not running after startup."
              exit 1
            fi
            echo "App stayed alive for 8 seconds."

name: Build ChatGPT Box Debug

on:
  push:
    branches:
      - main
      - feature/context-health-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run shared tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testDebugUnitTest --tests "com.kuyermqi.quotawidget.context.ContextHealthTest"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk out/ChatGPT-Box-v0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Box-v0.2.0-debug
          path: out/ChatGPT-Box-v0.2.0-debug.apk
          if-no-files-found: error
